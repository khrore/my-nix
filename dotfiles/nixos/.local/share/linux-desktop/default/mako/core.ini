anchor=top-right
default-timeout=5000
width=420
outer-margin=20
padding=10,15
border-size=1
border-radius=12
max-icon-size=32
font=Inter 14px

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false

[urgency=critical]
default-timeout=0
layer=overlay

[summary~="Learn Keybindings"]
on-button-left=exec sh -c 'notification-dismiss "Learn Keybindings"; menu-keybindings'

[summary~="Screenshot copied & saved"]
max-icon-size=80
format=<b>%s</b>\n%b
