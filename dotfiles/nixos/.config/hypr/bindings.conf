# Application bindings
bindd = ALT, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, launch-editor
bindd = SUPER SHIFT, D, Docker, exec, launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- bitwarden

# Add extra bindings
bind = SUPER, TAB, exec, hyprctl switchxkblayout gaming-keyboard next
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Override existing bindings, such as putting the main menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Main menu, exec, menu

bind = SUPER SHIFT, R, exec, hyprctl switchxkblayout all next
